<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-label="Holographic light ripples">
<defs>
<linearGradient id="prism"><stop stop-color="#4285ff"/><stop offset=".22" stop-color="#48efff"/><stop offset=".43" stop-color="#9965ff"/><stop offset=".62" stop-color="#f25bdf"/><stop offset=".8" stop-color="#ffc76a"/><stop offset="1" stop-color="#56f4bc"/></linearGradient>
<radialGradient id="haze"><stop stop-color="#7360ff" stop-opacity=".18"/><stop offset="1" stop-color="#7360ff" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
